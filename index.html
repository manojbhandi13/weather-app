<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherApp</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="loader">
      <div class="load"></div>
    </div>
    <div class="container hide">
      <header class="">
        <h3 class="hide"></h3>
        <input type="text" placeholder="search.. eg., Dharwad" />
      </header>
      <main class="">
        <section class="quick-status">
          <div class="weather-main">
            <p id="weather">OverCast Clouds</p>
            <img src="" alt="" id="weather-icon" />
            <p id="weather-desc">Light Rain</p>
          </div>
          <div class="weather-temp">
            <p id="temp">23&deg;C</p>
            <p id="temp-feels">Feels like 23&deg;C</p>
          </div>
        </section>
        <section class="indicators">
          <article id="wind-speed" class="tile-background">
            Wind: 1.5m/s
          </article>
          <article id="humidity" class="tile-background">Humidity: 60%</article>
          <article id="uv-index" class="tile-background">UV Index: _._</article>
          <article id="pressure" class="tile-background">
            Pressure: 1011hPa
          </article>
          <article id="visibility" class="tile-background">
            Visibility: 10.0km
          </article>
          <article id="dew-point" class="tile-background">
            Dew Point: _&deg;C
          </article>
        </section>
        <section class="hourly">
          <div class="hourly-scroll"></div>
        </section>
        <section class="weekly">
          <div class="weekly-scroll"></div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
